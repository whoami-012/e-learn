name: elearn_app
description: "An e-learning mobile application."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.9
  flutter_secure_storage: ^9.2.4
  http: ^1.6.0
  http_parser: ^4.1.2
  image_picker: ^1.2.1
  file_picker: ^10.3.8
  provider: ^6.1.5
  syncfusion_flutter_pdfviewer: ^31.2.18
  url_launcher: ^6.3.2
  webview_flutter: ^4.13.1
  webview_flutter_android: ^4.3.0
  agora_rtc_engine: ^6.5.4
  permission_handler: ^12.0.3
  path_provider: ^2.1.6
  firebase_core: ^4.11.0
  firebase_auth: ^6.5.4
  google_sign_in: ^7.2.0
  sign_in_with_apple: ^7.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
